[tool:pytest]
# Pytest configuration for procurement platform

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    auth: authentication related tests
    rfq: RFQ related tests
    bid: bid related tests
    public: public endpoint tests
    ai: AI feature tests
    websocket: WebSocket tests
    database: database related tests

# Output options
addopts = 
    --strict-markers
    --strict-config
    --tb=short
    --ra=N
    -p no:warnings
    --maxfail=10

# Minimum version
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Coverage options (when --cov is used)
[coverage:run]
source = app
omit = 
    app/tests/*
    app/tasks/*
    */migrations/*
    */alembic/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

show_missing = True
skip_covered = False
precision = 2

[coverage:html]
directory = htmlcov
